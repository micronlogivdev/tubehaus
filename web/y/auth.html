<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>ClearTube</title>
<!-- Sign-up / sign-in page of a public instance started with HT_ACCOUNTS=1.
     The reverse proxy sends anyone without a session here (see deploy/Caddyfile.public). -->
<style>
  :root { --bg: #f9f9f9; --card: #fff; --fg: #0f0f0f; --fg2: #606060; --line: #e5e5e5; --red: #ff0033; --blue: #065fd4; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0f0f0f; --card: #212121; --fg: #f1f1f1; --fg2: #aaa; --line: #3f3f3f; --blue: #3ea6ff; } }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg);
    font: 15px/1.5 Roboto, "Noto Sans KR", Arial, sans-serif; padding: 16px; }
  .card { width: 100%; max-width: 380px; background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 28px 24px; }
  .logo { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 20px; margin-bottom: 18px; }
  h1 { font-size: 22px; margin: 0 0 6px; }
  p.sub { color: var(--fg2); margin: 0 0 20px; font-size: 14px; }
  label { display: block; font-size: 13px; font-weight: 500; margin: 14px 0 6px; }
  input { width: 100%; height: 44px; padding: 0 12px; border: 1px solid var(--line); border-radius: 10px; background: transparent; color: inherit; font: inherit; }
  input:focus { outline: 2px solid var(--blue); outline-offset: -1px; }
  small { color: var(--fg2); font-size: 12px; }
  .hp { position: absolute; left: -10000px; width: 1px; height: 1px; overflow: hidden; }
  button { width: 100%; height: 44px; margin-top: 22px; border: 0; border-radius: 22px; background: var(--fg); color: var(--bg); font: inherit; font-weight: 600; cursor: pointer; }
  button:disabled { opacity: .6; cursor: default; }
  .err { color: #d93025; font-size: 14px; min-height: 20px; margin-top: 12px; }
  .switch { margin-top: 18px; text-align: center; font-size: 14px; color: var(--fg2); }
  .switch a { color: var(--blue); text-decoration: none; font-weight: 500; }
  /* language: asked first on a first visit, a small selector afterwards */
  .langs { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
  .langs .lang { margin: 0; height: 44px; border: 1px solid var(--line); border-radius: 10px; background: transparent; color: var(--fg); font-weight: 400; }
  .langs .lang:hover, .langs .lang:focus { border-color: var(--blue); outline: 0; }
  .langs .lang.on { border-color: var(--blue); color: var(--blue); font-weight: 600; }
  .langsel { margin-top: 16px; text-align: center; }
  .langsel select { height: 34px; padding: 0 8px; border: 1px solid var(--line); border-radius: 8px; background: transparent; color: var(--fg2); font: inherit; font-size: 13px; }
  .langsel select option { color: initial; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main class="card">
  <div class="logo"><svg width="30" height="20" viewBox="0 0 30 20"><rect width="30" height="20" rx="5.5" fill="#ff0033"/><path d="M12 6l8 4-8 4z" fill="#fff"/></svg>ClearTube</div>
  <section id="pick" hidden>
    <h1 id="ltitle"></h1>
    <div class="langs" id="langs"></div>
  </section>
  <section id="main">
  <h1 id="title"></h1>
  <p class="sub" id="sub"></p>
  <form id="f" novalidate>
    <label for="u" id="lu"></label>
    <input id="u" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" maxlength="24" required>
    <small id="hu"></small>
    <label for="p" id="lp"></label>
    <input id="p" name="password" type="password" minlength="8" maxlength="200" required>
    <small id="hp"></small>
    <div class="hp" aria-hidden="true"><input id="w" name="website" tabindex="-1" autocomplete="off"></div>
    <button id="go"></button>
    <div class="err" id="err" role="alert"></div>
  </form>
  <div class="switch" id="switch"></div>
  <div class="langsel"><select id="lang" aria-label="Language"></select></div>
  </section>
</main>
<script type="module">
  import { $t, $tMsg, LANG, LANGS, FIRST_VISIT, langLabel } from "/y/i18n.js";   // absolute: this page is served at /signup and /login
  const $ = (id) => document.getElementById(id);
  // the language comes first, like in the app: saved in the same settings, so the app follows it
  const setLang = (c) => {
    let s = {};
    try { s = JSON.parse(localStorage.getItem("yt.settings") || "{}") || {}; } catch { }
    s.lang = c;
    try { localStorage.setItem("yt.settings", JSON.stringify(s)); } catch { }
    location.reload();
  };
  for (const [c, n] of LANGS) $("lang").append(new Option(n, c, false, c === LANG));
  $("lang").onchange = (e) => setLang(e.target.value);
  if (FIRST_VISIT) {
    $("main").hidden = true;
    $("pick").hidden = false;
    $("ltitle").textContent = langLabel();
    for (const [c, n] of LANGS) {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "lang" + (c === LANG ? " on" : "");
      b.textContent = n;
      b.onclick = () => setLang(c);
      $("langs").append(b);
    }
    $("langs").querySelector(".on")?.focus();
  }
  const signup = !location.pathname.startsWith("/login");
  // where to go afterwards: only a path on this site (parsed, so "/\\evil.com" and friends can't leave it)
  const back = (() => {
    try {
      const u = new URL(new URLSearchParams(location.search).get("r") || "/", location.origin);
      return u.origin === location.origin ? u.pathname + u.search + u.hash : "/";
    } catch { return "/"; }
  })();
  const q = "?r=" + encodeURIComponent(back);
  $("title").textContent = signup ? $t("계정 만들기") : $t("로그인");
  $("sub").textContent = $t("이 서버를 쓰려면 계정이 필요해요. 이메일 같은 개인정보는 받지 않아요.");
  $("lu").textContent = $t("사용자 이름");
  $("lp").textContent = $t("비밀번호");
  $("hu").textContent = signup ? $t("영문 소문자, 숫자, _ 로 3~24자") : "";
  $("hp").textContent = signup ? $t("8자 이상") : "";
  $("p").autocomplete = signup ? "new-password" : "current-password";
  $("go").textContent = signup ? $t("계정 만들기") : $t("로그인");
  const other = document.createElement("a");
  other.href = (signup ? "/login" : "/signup") + q;
  other.textContent = signup ? $t("로그인") : $t("계정 만들기");
  $("switch").append(signup ? $t("이미 계정이 있나요?") : $t("계정이 없나요?"), " ", other);
  $("f").onsubmit = async (e) => {
    e.preventDefault();
    $("go").disabled = true;
    $("err").textContent = "";
    try {
      const r = await fetch(signup ? "/api/p/auth/signup" : "/api/p/auth/login", {
        method: "POST", credentials: "same-origin", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username: $("u").value, password: $("p").value, website: $("w").value }),
      });
      const d = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error($tMsg(d.error || String(r.status)));
      location.replace(new URL(back, location.origin).href);
    } catch (ex) {
      $("err").textContent = ex.message;
      $("go").disabled = false;
    }
  };
  if (!FIRST_VISIT) $("u").focus();
</script>
</body>
</html>
